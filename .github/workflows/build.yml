name: Build distributions

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  sdist:
    name: Source distribution
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install build twine -r requirements-test.txt
      - name: Build, check, and install the source archive
        run: |
          python -m build --sdist
          python -m twine check --strict dist/*
          python -m pip install dist/*.tar.gz
      - name: Test the installed source distribution
        env:
          PRIVPY_HYPOTHESIS_PROFILE: ci
        run: python -m unittest discover -s tests -t . -q
      - uses: actions/upload-artifact@v4
        with:
          name: dist-sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  wheels:
    name: Wheels / ${{ matrix.os }}
    needs: sdist
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15-intel, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist-sdist
          path: dist
      - name: Unpack the tested source archive
        run: |
          mkdir wheel-source
          tar -xzf dist/*.tar.gz --strip-components=1 -C wheel-source
      - name: Build and test CPython 3.9–3.14 wheels
        uses: pypa/cibuildwheel@v4.2.1
        env:
          CIBW_ARCHS: native
        with:
          package-dir: wheel-source
          output-dir: wheelhouse
      - uses: actions/upload-artifact@v4
        with:
          name: dist-wheels-${{ matrix.os }}
          path: wheelhouse/*.whl
          if-no-files-found: error

  validate:
    name: Validate the complete release bundle
    needs: [sdist, wheels]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist
      - run: python -m pip install twine
      - run: python -m twine check --strict dist/*
      - name: Verify all versions, native binaries, and platform targets
        run: python scripts/check_dist.py dist --release-matrix
      - uses: actions/upload-artifact@v4
        with:
          name: release-distributions
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error
