name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  contract:
    name: Python ${{ matrix.python }} / ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
        python: ["3.12", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements-test.txt
      - run: python -m pip install -r requirements-test.txt .
      - name: Test installed package with generated examples
        env:
          PRIVPY_HYPOTHESIS_PROFILE: ci
        run: |
          python -m coverage run -m unittest discover -s tests -t . -q
          python -m coverage report
          python -m coverage xml -o test-results/coverage.xml
      - name: Save Python coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.os }}-${{ matrix.python }}
          path: test-results/
          if-no-files-found: warn
      - name: Build UndefinedBehaviorSanitizer runtime
        run: python -m privpy.build --sanitize --output "$RUNNER_TEMP/runtime-sanitized.so"
      - name: Exercise native runtime with UndefinedBehaviorSanitizer
        env:
          PRIVPY_HYPOTHESIS_PROFILE: dev
          PRIVPY_NATIVE: ${{ runner.temp }}/runtime-sanitized.so
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: python -m unittest discover -s tests -t . -q
