[build-system]
requires = ["setuptools>=58", "wheel"]
build-backend = "setuptools.build_meta"

[tool.coverage.run]
branch = true
source = ["privpy"]
omit = ["*/privpy/build.py"]

[tool.coverage.report]
show_missing = true
fail_under = 90

[tool.cibuildwheel]
build = "cp39-* cp310-* cp311-* cp312-* cp313-* cp314-*"
skip = "*-musllinux_*"
test-requires = ["hypothesis>=6.100,<7"]
test-sources = ["tests", "scripts"]
test-command = "python -m unittest discover -s tests -t . -q"
test-environment = { PRIVPY_HYPOTHESIS_PROFILE = "dev" }

[tool.cibuildwheel.linux]
manylinux-x86_64-image = "manylinux_2_28"
manylinux-aarch64-image = "manylinux_2_28"

[tool.cibuildwheel.macos]
# Floating-point std::to_chars requires a recent Apple libc++.
environment = { MACOSX_DEPLOYMENT_TARGET = "14.0" }
